name: Java Spring Boot CI/CD Pipeline

# 1. TRIGGERS: Webhook events that start the pipeline
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 2. JOBS: Sequential or parallel execution units
jobs:
  # -------------------------------------------------------------
  # JOB 1: BUILD & TEST (Runs on PRs and Pushes)
  # -------------------------------------------------------------
  test:
    name: Run Unit, Slice, and Testcontainers Tests
    runs-on: ubuntu-latest

    steps:
      # Step A: Checkout code from the repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step B: Set up Java JDK 21 with automatic Maven dependency caching
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Step C: Grant execution permission to Maven Wrapper
      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      # Step D: Execute tests (Unit, Slice, and Testcontainers)
      # Note: Docker is pre-installed on 'ubuntu-latest', so Testcontainers works automatically!
      - name: Run Test Suite
        run: ./mvnw clean test

  # -------------------------------------------------------------
  # JOB 2: PACKAGE & PUSH DOCKER IMAGE (Runs ONLY when merged to main)
  # -------------------------------------------------------------
  build-and-push-image:
    name: Build OCI Docker Image & Push to Docker Hub
    needs: test # DEPENDENCY GATE: Job 2 ONLY runs if Job 1 succeeds!
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step A: Log into Docker Hub securely using GitHub Secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step B: Set up Docker Buildx for advanced layer caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step C: Extract metadata (tags, labels) based on Git state
      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/spring-boot-user-service
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # Step D: Build the Docker Image and Push to Registry
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max